name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-web:
    name: Build Web/PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindvault-web
          path: dist/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindvault-windows
          path: release/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          sdk-platforms: android-36
          build-tools-version: '36.0.0'
          ndk-version: '26.2.11394342'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Add Android platform
        run: npx cap add android
      
      - name: Build APK
        run: npm run apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindvault-android
          path: release/Mindvault-debug.apk

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-windows, build-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: mindvault-web
          path: dist/
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: mindvault-windows
          path: release-windows/
      
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: mindvault-android
          path: release-android/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            release-windows/**/*
            release-android/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
