name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v0.3.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web/PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package Web/PWA
        run: cd dist && zip -qr ../mindvault-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-web
          path: mindvault-web.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build installer and portable ZIP
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm Windows assets exist
        shell: pwsh
        run: |
          if (-not (Get-ChildItem release -Filter '*.exe' -File -ErrorAction SilentlyContinue)) { throw 'Missing Windows installer' }
          if (-not (Get-ChildItem release -Filter '*.zip' -File -ErrorAction SilentlyContinue)) { throw 'Missing portable Windows ZIP' }
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - run: npm ci
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Android debug APK on Linux
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../release
          cp app/build/outputs/apk/debug/app-debug.apk ../release/Mindvault-debug.apk
          test -s ../release/Mindvault-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mindvault-android
          path: release/Mindvault-debug.apk
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-windows, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mindvault-web
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: mindvault-windows
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: mindvault-android
          path: release-assets
      - name: Verify all three platform bundles
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/mindvault-web.zip
          test -s release-assets/Mindvault-debug.apk
          compgen -G 'release-assets/*.exe' >/dev/null
          compgen -G 'release-assets/*.zip' >/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
